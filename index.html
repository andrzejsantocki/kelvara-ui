<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kelvara — institutional-grade Solana risk intelligence.">
  <title>Kelvara — Solana Risk Intelligence</title>
  <style>
    :root { color-scheme: light; --ink:#111827; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#fff; color:var(--ink); font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(720px,100%); }
    .mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--line); border-radius:12px; font-weight:800; color:var(--accent); }
    h1 { margin:32px 0 12px; font-size:clamp(3rem,10vw,6rem); line-height:.95; letter-spacing:-.07em; }
    p { max-width:580px; margin:0; color:var(--muted); font-size:clamp(1rem,2.5vw,1.25rem); }
    footer { margin-top:64px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.875rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">K</div>
    <h1>Kelvara</h1>
    <p>Institutional-grade Solana risk intelligence. Early detection for program upgrades, authority changes, and liquidity anomalies.</p>
    <footer>Coming soon.</footer>
  </main>
</body>
</html>
